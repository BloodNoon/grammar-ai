name: Deploy StudentsWriting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /home/studentsw/repositories/StudentsWriting && git fetch origin main && git reset --hard origin/main && /home/studentsw/repositories/StudentsWriting/client/deploy-safe.sh'
